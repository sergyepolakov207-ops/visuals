name: Build SWIFT VISUALS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q "Swift visuals.zip" -d extracted

      - name: Build SWIFT VISUALS
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew build
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload SWIFT VISUALS
        uses: actions/upload-artifact@v4
        with:
          name: SWIFT-VISUALS
          path: artifacts/*.jar
